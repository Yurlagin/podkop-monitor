name: release

# Релиз по тегу vX.Y.Z: собирает .ipk и публикует его вместе с install.sh.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия совпадает с тегом
        run: |
          [ "v$(cat VERSION)" = "$GITHUB_REF_NAME" ] || { echo "VERSION=$(cat VERSION), тег $GITHUB_REF_NAME"; exit 1; }

      - name: Сборка
        run: |
          ./build.sh "$GITHUB_REPOSITORY"
          # копия с постоянным именем — для ссылки .../releases/latest/download/podkop-monitor_all.ipk
          cp dist/podkop-monitor_*_all.ipk dist/podkop-monitor_all.ipk
          sed "s#@REPO@#$GITHUB_REPOSITORY#g" install.sh > dist/install.sh

      # --verify-tag: если тег ещё не виден API, упасть, а не создать черновик «untagged-…» (так было с v0.1.4)
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ipk dist/install.sh --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
